name: Speiseplan aktualisieren und veröffentlichen

on:
  schedule:
    # Jeden Montag 05:17 UTC (06:17 MEZ / 07:17 MESZ).
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths:
      - "download_latest_pdf.py"
      - "uke_speiseplan.py"
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Aktuellen UKE-Speiseplan laden
        run: python download_latest_pdf.py -o _work/speiseplan.pdf

      - name: PDF auslesen
        run: python uke_speiseplan.py _work/speiseplan.pdf -o public/data/speiseplan.json

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Vue-Anwendung bauen
        run: |
          npm ci
          npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Seitenpaket hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
